services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: sep_2
      MARIADB_ROOT_PASSWORD: 1234
      MARIADB_ROOT_HOST: "%"
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
      - mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10




  app:
    platform: linux/amd64
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DISPLAY: host.docker.internal:0.0
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: sep_2
      DB_USER: root
      DB_PASSWORD: 1234
    command:
      [
        "mvn",
        "javafx:run"
      ]

volumes:
  mariadb_data:
