apiVersion: v1
kind: Secret
metadata:
    name: sep-2-secret
type: Opaque
stringData:
    db-password: "1234"

---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: sep-2
spec:
    replicas: 1
    selector:
        matchLabels:
            app: sep-2
    template:
        metadata:
            labels:
                app: sep-2
        spec:
            containers:
                - name: sep-2
                  image: ksenishl/software-engineering-project-2:latest
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: DB_HOST
                        value: "host.minikube.internal"
                      - name: DB_PORT
                        value: "3306"
                      - name: DB_NAME
                        value: "sep_2"
                      - name: DB_USER
                        value: "root"
                      - name: DB_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: sep-2-secret
                                key: db-password
                      - name: DISPLAY
                        value: "host.minikube.internal:0.0"
