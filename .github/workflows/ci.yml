name: ci

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: "17"

            - name: build project, test project and generate report
              run: mvn verify

            - uses: actions/configure-pages@v5

            - uses: actions/upload-pages-artifact@v4
              with:
                  path: target/site/jacoco

    publish-report:
        if: github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-24.04

        permissions:
            pages: write
            id-token: write

        steps:
            - name: publish report to github pages
              id: publish-report
              uses: actions/deploy-pages@v4

        environment:
            name: github-pages
            url: ${{ steps.publish-report.outputs.page_url }}

    publish-docker:
        if: github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v7

            - name: login to docker hub
              uses: docker/login-action@v4
              with:
                  username: ksenishl
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: build and push docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ksenishl/software-engineering-project-2:latest
